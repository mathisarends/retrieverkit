[project]
name = "retrieval"
version = "0.1.0"
description = "Provider-agnostic indexing and retrieval."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
openai = [
    "openai>=1.100.0",
    "python-dotenv>=1.1.0",
]
sqlite = [
    "aiosqlite>=0.21.0",
    "sqlite-vec>=0.1.9,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["retrieval"]
